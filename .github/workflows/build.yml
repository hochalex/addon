name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signatur-Keystore aus Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ASSISTENT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ASSISTENT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Keine Signatur-Secrets gesetzt – APK wird mit wechselndem Debug-Schlüssel signiert (Updates nur nach Deinstallation möglich). Siehe README."
          fi

      - name: Tests & Release-APK
        env:
          ASSISTENT_KEYSTORE_PASSWORD: ${{ secrets.ASSISTENT_KEYSTORE_PASSWORD }}
          ASSISTENT_KEY_ALIAS: ${{ secrets.ASSISTENT_KEY_ALIAS }}
          ASSISTENT_KEY_PASSWORD: ${{ secrets.ASSISTENT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk "Assistent-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Assistent-1.0.${{ github.run_number }}
          path: Assistent-1.0.${{ github.run_number }}.apk

      - name: Als Release veröffentlichen (für einfachen Download am Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Assistent 1.0.${{ github.run_number }} (${{ github.ref_name }})
          prerelease: true
          files: Assistent-1.0.${{ github.run_number }}.apk
